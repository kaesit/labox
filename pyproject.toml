[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labox"
version = "0.1.0"
description = "An open-source laboratory automation and experimentation platform."
readme = "README.md"
requires-python = ">=3.12.3,<3.13"
license = { text = "MIT" }

dependencies = [
    "python-dotenv>=1.0.1",
    "opencv-python>=4.10.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "torch<=2.2.2",
    "torchvision==0.17.0",
    "pyserial>=3.5",
    "pyusb>=1.2.1",
    "boto3>=1.35.0",
    "rich>=13.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyside6>=6.7.0",
    "pydantic>=2.9.0",
    "typing-extensions>=4.12.0",
    "dotenv>=0.9.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.156.6",
    "ruff>=0.15.21",
    "mypy>=2.3.0",
    "psutil>=7.2.2",
    "setuptools>=84.0.0",
    "pybind11>=3.1.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.3.0",
"pytest-asyncio>=0.24.0",
"hypothesis>=6.115.0",
"ruff>=0.6.0",
"mypy>=1.13.0",
]

[project.scripts]
labox = "labox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
"E",
"F",
"I",
"UP",
"B",
]

[tool.mypy]
python_version = "3.12"
strict = true
